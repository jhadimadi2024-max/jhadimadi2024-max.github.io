    <!-- Native Edge-to-Edge & Status Bar Bridge Script for Android WebView / Flutter / React Native / Median / iOS -->
    <script>
      (function() {
        var BRAND_GREEN = '#16a34a';
        var BRAND_BLACK = '#000000';
        function applyEdgeToEdge() {
          var isSplash = document.documentElement.classList.contains('splash-active') || (document.body && document.body.classList.contains('splash-active'));
          var activeColor = isSplash ? BRAND_BLACK : BRAND_GREEN;

          // 1. Ensure theme-color and nav-bar meta tags match the active state
          var metaThemes = document.querySelectorAll('meta[name="theme-color"], meta[name="msapplication-navbutton-color"], meta[name="navigation-bar-color"]');
          metaThemes.forEach(function(el) {
            el.setAttribute('content', activeColor);
          });

          // 2. Median.co / GoNative WebView EdgeToEdge bridge
          try {
            if (window.median && window.median.statusbar) {
              window.median.statusbar.set({ style: 'light', color: activeColor, overlay: true });
            }
          } catch (e) {}

          // 3. React Native WebView bridge
          try {
            if (window.ReactNativeWebView && typeof window.ReactNativeWebView.postMessage === 'function') {
              window.ReactNativeWebView.postMessage(JSON.stringify({
                type: 'SET_STATUS_BAR',
                translucent: true,
                backgroundColor: activeColor,
                barStyle: 'light-content'
              }));
            }
          } catch (e) {}

          // 4. Android JavaScript Interface bridge (if native app exposes it)
          try {
            if (window.AndroidBridge && typeof window.AndroidBridge.setEdgeToEdge === 'function') {
              window.AndroidBridge.setEdgeToEdge(true);
            }
            if (window.AndroidBridge && typeof window.AndroidBridge.setStatusBarColor === 'function') {
              window.AndroidBridge.setStatusBarColor(activeColor);
            }
            if (window.AndroidBridge && typeof window.AndroidBridge.setNavigationBarColor === 'function') {
              window.AndroidBridge.setNavigationBarColor(activeColor);
            }
          } catch (e) {}

          // 5. Capacitor & Cordova Native Bridges
          try {
            if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.StatusBar) {
              window.Capacitor.Plugins.StatusBar.setOverlaysWebView({ overlay: true });
              window.Capacitor.Plugins.StatusBar.setBackgroundColor({ color: activeColor });
            }
            if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.NavigationBar) {
              window.Capacitor.Plugins.NavigationBar.setColor({ color: activeColor });
            }
          } catch (e) {}
          try {
            if (window.StatusBar) {
              window.StatusBar.overlaysWebView(true);
              window.StatusBar.backgroundColorByHexString(activeColor);
            }
            if (window.NavigationBar) {
              window.NavigationBar.backgroundColorByHexString(activeColor);
            }
          } catch (e) {}
        }

        applyEdgeToEdge();
        window.addEventListener('DOMContentLoaded', applyEdgeToEdge);
        window.addEventListener('load', applyEdgeToEdge);
        window.addEventListener('resize', applyEdgeToEdge);
        window.addEventListener('orientationchange', applyEdgeToEdge);
        window.__applyEdgeToEdge = applyEdgeToEdge;

        // Failsafe auto-dismiss after 3800ms to guarantee zero infinite freeze
        setTimeout(function() {
          try {
            document.documentElement.classList.remove('splash-active');
            if (document.body) document.body.classList.remove('splash-active');
            var preHydrate = document.getElementById('pre-hydration-splash');
            if (preHydrate) preHydrate.style.display = 'none';
          } catch (_) {}
        }, 3800);
      })();
    </script>

    <script>
      (function() {
        // Safe Console Filter for known benign iframe sandbox warnings
        try {
          var origWarn = console.warn;

            'Permissions policy violation',
            'No ID or name found in config',
            'preloaded using link preload but not used',
            'code.tidio.co/fonts'

          console.warn = function() {
            var msg = Array.prototype.slice.call(arguments).map(function(item) { return String(item); }).join(' ');
            for (var i = 0; i < benignWarnings.length; i++) {
              if (msg.indexOf(benignWarnings[i]) !== -1) return;
            }
            return origWarn.apply(console, arguments);
          };
        } catch (_) {}

        function hideTidioLauncher() {
          try {
            if (window.tidioChatApi) {
              window.tidioChatApi.hide();
              window.tidioChatApi.on('close', function() {
                try {
                  document.body.classList.remove('tidio-chat-visible');
                  window.tidioChatApi.hide();
                } catch (_) {}
              });
            }
          } catch (_) {}
        }

        if (window.tidioChatApi && window.tidioChatApi.isReady) {
          hideTidioLauncher();
        } else {
          document.addEventListener('tidioChat-ready', hideTidioLauncher);
        }

        // Lazy load Tidio in background after page hydration to eliminate font preload warnings
        var loadTidioScript = function() {
          if (document.querySelector('script[src*="tidio.co"]')) return;
          var s = document.createElement('script');
          s.src = '//code.tidio.co/rhikfdzcdjdqjewrch3mzvppdtksokyc.js';
          s.async = true;
          s.onerror = function() {
            console.warn('[SafeScript] Tidio live chat script unavailable or offline - safely bypassed.');
          };
          document.head.appendChild(s);
        };

        if (document.readyState === 'complete') {
          setTimeout(loadTidioScript, 1500);
        } else {
          window.addEventListener('load', function() {
            setTimeout(loadTidioScript, 1500);
          });
        }
      })();
    </script>
